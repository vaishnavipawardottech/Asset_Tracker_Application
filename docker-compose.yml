services:
  frontend:
    # image: pawarvaishnavi/asset-tracker-frontend:multistage
    build: 
      context: ./frontend
      dockerfile: Dockerfile.multistage
    container_name: asset-tracker-frontend
    ports:
      - "${FRONTEND_HOST_PORT}:5173"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - asset-tracker-network

  

  backend:
    # image: pawarvaishnavi/asset-tracker-backend:multistage
    build: 
      context: ./backend
      dockerfile: Dockerfile.multistage
    container_name: asset-tracker-backend
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_PORT}"
    environment:
      PORT: ${BACKEND_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_HOST: ${POSTGRES_HOST}
      DB_NAME: ${POSTGRES_DB}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: ${POSTGRES_PORT}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asset-tracker-network

  

  postgres:
    image: postgres:17-alpine
    container_name: asset-tracker-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init/postgres:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - asset-tracker-network


volumes:
  postgres_data:
  
networks:
  asset-tracker-network:
    driver: bridge