kind: HorizontalPodAutoscalar
apiVersion: autoscaling/v2
metadata:
  name: frontend-hpa
  namespace: devboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
  scaleUp:
    stabilizationWindowSeconds: 10
    policies:
      - type: Pods
        value: 2
        periodSeconds: 10