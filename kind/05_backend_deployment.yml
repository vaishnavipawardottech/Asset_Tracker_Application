kind: Deployment
apiVersion: apps/v1
metadata:
  name: backend-deployment
  labels:
    app: asset-tracker-be
    namespace: asset-tracker-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-tracker-be
  template:
    metadata:
      labels:
        app: asset-tracker-be
    spec:
      containers:
      - name: asset-tracker-backend
        image: pawarvaishnavi/asset-tracker-backend:v3
        ports:
        - containerPort: 5000
        env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: asset-tracker-secrets
                key: DB_PASSWORD
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: asset-tracker-configmap
                key: DB_USER
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: asset-tracker-configmap
                key: DB_NAME
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: asset-tracker-configmap
                key: DB_HOST
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: asset-tracker-configmap
                key: DB_PORT

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

        startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24

        readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3 

        livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3


