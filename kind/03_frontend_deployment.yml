kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend-deployment
  labels:
    app: asset-tracker-fe
    namespace: asset-tracker-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-tracker-fe
  template:
    metadata:
      labels:
        app: asset-tracker-fe
    spec:
      containers:
      - name: asset-tracker-frontend
        image: pawarvaishnavi/asset-tracker-frontend:v3
        ports:
        - containerPort: 5173

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

        readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

        livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

